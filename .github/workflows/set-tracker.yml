# Sætradar: scans YouTube and SoundCloud every two hours, keeps the results on
# the set-tracker-data branch, and publishes set-tracker/web to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#
# The page is only published after the browser self-checks pass; if they fail,
# the version already online stays up. Changing artists in the app commits
# config/artists.json, which is a push and so starts a scan right away.
name: Sætradar

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Health check: links to uploads to judge end to end (space separated). Leave empty for a normal scan."
        required: false
        default: ""
      reset:
        description: "Start over: forget saved results and take a new baseline (heard marks in browsers are kept)."
        type: boolean
        required: false
        default: false
  push:
    paths:
      - "set-tracker/**"
      - ".github/workflows/set-tracker.yml"

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: set-tracker
  cancel-in-progress: false

jobs:
  scan:
    # Schedules only ever run on the default branch; pushes elsewhere are ignored.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: set-tracker/requirements.txt

      - name: Install yt-dlp and numpy
        timeout-minutes: 8
        run: pip install --upgrade -r set-tracker/requirements.txt

      - name: Install ffmpeg
        # Ubuntu's package mirrors sometimes hang (once for 40 minutes). Without
        # ffmpeg the scan still runs; it only cannot measure the sound.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          command -v ffmpeg && exit 0
          sudo timeout 150 apt-get update -q -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          sudo timeout 150 apt-get install -y -q --no-install-recommends ffmpeg

      - name: Self-test
        timeout-minutes: 5
        working-directory: set-tracker
        run: python -m unittest discover -s tests

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1-chromium

      - name: Browser self-check
        # The page as it would be published: iPhone and desktop sizes, both
        # themes, and the "Overvågninger" sheet against a stand-in for GitHub.
        id: browser
        timeout-minutes: 15
        continue-on-error: true
        working-directory: set-tracker
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
          python -m http.server 8766 --directory web > /dev/null 2>&1 &
          sleep 1
          export SHOTS="$RUNNER_TEMP/ui-shots" WEB_DIR=web
          # One retry, for a runner that is slow to start the browser.
          node tests/ui_check.mjs || node tests/ui_check.mjs
          node tests/ui_admin.mjs || node tests/ui_admin.mjs

      - name: Probe
        if: github.event_name == 'workflow_dispatch' && inputs.probe != ''
        continue-on-error: true
        working-directory: set-tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PROBE: ${{ inputs.probe }}
        run: python -m tracker --probe $PROBE

      - name: Fetch saved data
        id: saved
        if: github.event_name != 'workflow_dispatch' || !inputs.reset
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: set-tracker-data
          path: tracker-data

      - name: Scan
        id: scan
        continue-on-error: true
        working-directory: set-tracker
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          mkdir -p ../tracker-data
          if [ -n "$YTDLP_COOKIES" ]; then
            printf '%s\n' "$YTDLP_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YTDLP_COOKIES_FILE="$RUNNER_TEMP/cookies.txt"
          fi
          python -m tracker --data-dir ../tracker-data

      - name: Save data to the set-tracker-data branch
        if: hashFiles('tracker-data/sets.json') != ''
        working-directory: tracker-data
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf .git
          git init -q -b set-tracker-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Sætradar data\n\nWritten by the Sætradar workflow every two hours. Do not edit by hand.\n' > README.md
          git add -A
          git commit -q -m "Sætradar data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" set-tracker-data

      - name: Build the site
        id: build
        if: steps.browser.outcome == 'success'
        run: |
          rm -rf _site
          cp -r set-tracker/web _site
          if [ -f tracker-data/sets.json ]; then cp tracker-data/sets.json tracker-data/sets.js _site/data/; fi
          rm -f _site/data/seen.json
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        if: steps.browser.outcome == 'success'
        with:
          path: _site

      - name: Keep the schedule alive
        # GitHub pauses schedules in repositories without activity for 60 days.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/set-tracker.yml/enable"

      - name: Report a failed browser check
        if: steps.browser.outcome != 'success'
        run: |
          echo "::error::The browser self-check failed, so the page was not published. The version already online stays up; the scan's data is saved."
          exit 1

      - name: Report a failed scan
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Every source failed in this scan. The page shows the errors under Kilder."
          exit 1

  deploy:
    needs: scan
    if: always() && needs.scan.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # Until Pages is switched on this fails on every run; a warning says so
        # without a failure e-mail every two hours.
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Explain a missing Pages site
        if: steps.deployment.outcome == 'failure'
        run: echo "::warning::Siden blev ikke udgivet. Slå GitHub Pages til under Settings → Pages → Source → GitHub Actions."
